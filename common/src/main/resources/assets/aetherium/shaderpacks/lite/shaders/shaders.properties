# Aetherium Lite (bundled with Aetherium). Low / Medium / High are the profiles below.
profile.LOW=WAVING_PLANTS WAVING_LEAVES !WATER_FX !WAVING_WATER !SKY_FX !BLOOM !GODRAYS !SHADOWS VIGNETTE
profile.MEDIUM=WAVING_PLANTS WAVING_LEAVES WATER_FX WAVING_WATER SKY_FX BLOOM !GODRAYS !SHADOWS VIGNETTE
profile.HIGH=WAVING_PLANTS WAVING_LEAVES WATER_FX WAVING_WATER SKY_FX BLOOM GODRAYS SHADOWS VIGNETTE
screen=<profile> <empty> [PLANTS] [WATER] [SKY] [LIGHTING] [COLOR]
screen.PLANTS=WAVING_PLANTS WAVING_LEAVES WAVING_STRENGTH WAVE_SPEED
screen.WATER=WATER_FX WAVING_WATER WATER_WAVES WATER_REFLECTIONS WATER_CLARITY WATER_SUN_GLINT WATER_TINT
screen.SKY=SKY_FX HORIZON_GLOW SUN_GLOW GODRAYS GODRAY_STRENGTH CLOUD_BRIGHTNESS
screen.LIGHTING=WARMTH TORCH_WARMTH SHADOWS SHADOW_DARKNESS shadowMapResolution shadowDistance
screen.COLOR=FILMIC EXPOSURE SATURATION CONTRAST BLOOM BLOOM_STRENGTH VIGNETTE VIGNETTE_STRENGTH
sliders=WAVING_STRENGTH WAVE_SPEED WATER_WAVES WATER_REFLECTIONS WATER_CLARITY HORIZON_GLOW SUN_GLOW GODRAY_STRENGTH CLOUD_BRIGHTNESS WARMTH TORCH_WARMTH SHADOW_DARKNESS shadowMapResolution shadowDistance EXPOSURE SATURATION CONTRAST BLOOM_STRENGTH VIGNETTE_STRENGTH
program.shadow.enabled=SHADOWS
program.composite.enabled=BLOOM || GODRAYS
clouds=fancy
# Aetherium Lite keeps vanilla per-face block shading
oldLighting=true
shadowTranslucent=false
