# Aetherium Lite (bundled with Aetherium). Low / Medium / High are the profiles below.
profile.LOW=WAVING_PLANTS !WATER_FX !BLOOM !GODRAYS !SHADOWS VIGNETTE
profile.MEDIUM=WAVING_PLANTS WATER_FX BLOOM !GODRAYS !SHADOWS VIGNETTE
profile.HIGH=WAVING_PLANTS WATER_FX BLOOM GODRAYS SHADOWS VIGNETTE
screen=<profile> <empty> WAVING_PLANTS WATER_FX BLOOM GODRAYS SHADOWS VIGNETTE EXPOSURE SATURATION BLOOM_STRENGTH WAVE_SPEED SHADOW_DARKNESS
sliders=EXPOSURE SATURATION BLOOM_STRENGTH WAVE_SPEED SHADOW_DARKNESS
program.shadow.enabled=SHADOWS
program.composite.enabled=BLOOM || GODRAYS
clouds=fancy
# Aetherium Lite keeps vanilla per-face block shading
oldLighting=true
shadowTranslucent=false
