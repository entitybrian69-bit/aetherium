# Reports whether the MODRINTH_TOKEN repository secret exists and which Modrinth account it
# belongs to. The token itself is never printed. Runs only when this file changes.
name: modrinth token check
on:
  push:
    branches: [arena/46f241da-aetherium]
    paths: ['.github/workflows/secret-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: check MODRINTH_TOKEN
        env:
          T: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::error::MODRINTH_TOKEN is NOT set as a repository secret"
            exit 1
          fi
          echo "::notice::MODRINTH_TOKEN is set (${#T} characters)"
          code=$(curl -s -o r.json -w '%{http_code}' -H "Authorization: $T" https://api.modrinth.com/v2/user)
          echo "::notice::Modrinth /v2/user answered HTTP $code"
          if [ "$code" = 200 ]; then
            python3 -c "import json; print('::notice::token belongs to Modrinth user:', json.load(open('r.json'))['username'])"
          else
            echo "(401 here can just mean the token has no 'Read user' scope; uploads need only 'Create versions')"
          fi
          rm -f r.json
