# Publishes the jars of the current mod_version (gradle.properties) to Modrinth:
#   Fabric jars   -> the main project, aetherium-team_aerix ("Aetherium")
#   NeoForge jars -> its own project, "Aetherium NeoForge" (created as a draft if it is missing)
# Modrinth refuses a file that already exists in another project, so NeoForge-only versions are
# removed from the main project before they are uploaded to the NeoForge one.
#
# * Called by ship.yml after every release, so a new version reaches Modrinth automatically.
# * Also runs on its own when this file or the publisher script changes (no rebuild needed: it
#   takes the jars from the GitHub releases that already exist).
# Versions already on Modrinth are skipped, so running it twice never duplicates anything.
# Needs the MODRINTH_TOKEN repository secret: a Modrinth PAT with the "Create versions" scope, plus
# "Create projects" and "Delete versions" for the one-time NeoForge split.
name: modrinth
on:
  push:
    branches: [arena/46f241da-aetherium]
    paths: ['.github/workflows/modrinth.yml', 'tools/modrinth_publish.py', 'tools/modrinth_project.py',
            'tools/modrinth/**']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: modrinth
  cancel-in-progress: false

jobs:
  publish:
    name: upload to Modrinth
    runs-on: ubuntu-latest
    env:
      MODRINTH_PROJECT: aetherium-team_aerix
      # "1" = check everything and list what would be uploaded, upload nothing.
      DRY_RUN: '0'
    steps:
      - uses: actions/checkout@v4
      - name: fetch the jars from the GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mod=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')
          mkdir -p dist
          for ver in $(python3 -c "import json; print(' '.join(r['version'] for r in json.load(open('tools/porting_pins.json'))['rows']))"); do
            if ! gh release download "v$mod+$ver" --repo "$GITHUB_REPOSITORY" -p 'aetherium-*.jar' -D dist --clobber; then
              echo "::warning::no release v$mod+$ver yet, skipped"
            fi
          done
          ls -l dist
      - name: make sure the NeoForge project exists
        id: neo
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/modrinth_project.py ensure aetherium-neoforge-team_aerix "Aetherium NeoForge"
      - name: take the NeoForge versions out of the main project
        if: env.DRY_RUN != '1'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/modrinth_project.py drop-loader "$MODRINTH_PROJECT" neoforge
      - name: upload Fabric to the main project
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          LOADERS: fabric
        run: python3 tools/modrinth_publish.py dist
      - name: upload NeoForge to the NeoForge project
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: ${{ steps.neo.outputs.slug }}
          LOADERS: neoforge
        run: python3 tools/modrinth_publish.py dist
      - name: list what the main project holds
        if: always()
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/modrinth_project.py list "$MODRINTH_PROJECT"
