# One-off Modrinth maintenance on the main project (aetherium-team_aerix). Runs only when this file
# changes; edit the steps for the next job. Every command is in tools/modrinth_project.py.
name: modrinth admin
on:
  push:
    branches: [arena/46f241da-aetherium]
    paths: ['.github/workflows/modrinth-admin.yml']
permissions:
  contents: read
concurrency:
  group: modrinth
  cancel-in-progress: false
jobs:
  admin:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      P: aetherium-team_aerix
    steps:
      - uses: actions/checkout@v4
      - name: current text
        run: python3 tools/modrinth_project.py show "$P"
      - name: delete the last hand-uploaded duplicate (1.16.5, numbered 1.0.0)
        run: python3 tools/modrinth_project.py delete-number "$P" fabric 1.0.0
      - name: summary and description without NeoForge
        run: python3 tools/modrinth_project.py text "$P" tools/modrinth/fabric_summary.txt tools/modrinth/fabric_body.md
      - name: text after the change
        run: python3 tools/modrinth_project.py show "$P"
      - name: what is left
        if: always()
        run: python3 tools/modrinth_project.py list "$P"
