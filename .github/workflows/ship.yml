name: ship

# One run does the whole shipping job for every row of the porting matrix:
#   materialize the ported tree (same file copy + patch that tools/port.sh --dry-run uses),
#   build :common/:fabric/:neoforge against that version's real pins,
#   publish a REAL (not draft) release v<mod_version>+<mcversion> with the jars it built
#   (only when that version compiled AND passed its tests),
#   then rewrite DOWNLOADS.md from the releases that actually exist and commit it.
#
# Why the release happens here and not in build.yml: build.yml proves one version
# (1.21.1) on three OSes, which is a correctness matrix, not a shipping matrix.
# Downloadable jars need one job per Minecraft version, because each needs a
# different Loom/ModDev target, a different Java toolchain, and its own tag.
#
# Leg failure never blocks another leg (fail-fast: false), and a red leg never creates
# or updates a release: a jar whose own build or tests failed is not shipped at all.

on:
  push:
    branches: [arena/46f241da-aetherium]
    # Probe/DOWNLOADS commits from CI and doc-only edits do not change a jar.
    paths-ignore:
      - '**.md'
      - 'tools/probe/**'
      - 'tools/probe_*.txt'
      - '.github/workflows/probe.yml'
      - '.github/workflows/secret-check.yml'
      - '.github/workflows/modrinth.yml'
      - 'tools/modrinth_publish.py'
      - 'tools/modrinth_project.py'
      - 'tools/modrinth/**'
      - '.github/workflows/modrinth-admin.yml'
      - 'backport/**'
      - '.github/workflows/backport.yml'
      - '.github/workflows/curseforge.yml'
      - 'tools/curseforge/**'
      - '.github/workflows/bench.yml'
      - 'bench/**'
      - 'tools/dev/**'
  workflow_dispatch:
    inputs:
      only:
        description: 'single version to ship (blank = all 33)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true

jobs:
  plan:
    name: which versions, which toolchain
    # [no-ship] in the head commit message: a test push (smoke test, probe), nothing is released.
    if: ${{ !contains(github.event.head_commit.message, '[no-ship]') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.picks.outputs.matrix }}
      # 'true' when every version ships; a partial (ship-only / single version) run is a GitHub-only
      # test build: prerelease, no Modrinth/CurseForge upload, DOWNLOADS.md left alone.
      full: ${{ steps.picks.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - id: picks
        shell: bash
        run: |
          python3 - "${{ github.event.inputs.only }}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          import os
          only = {(sys.argv[1] or '').strip()} - {''}
          # .github/ship-only: one Minecraft version per line (# comments). When it lists anything, a
          # push builds and releases only those versions (fast iteration on one version).
          if not only and os.path.exists('.github/ship-only'):
              for line in open('.github/ship-only'):
                  line = line.split('#', 1)[0].strip()
                  if line:
                      only.add(line)
          data = json.load(open('tools/porting_pins.json'))
          rows = data['rows']
          known = {row['version'] for row in rows}
          unknown = sorted(only - known)
          if unknown:
              print('unknown versions in ship-only: ' + ', '.join(unknown), file=sys.stderr)
              sys.exit(1)
          picks = []
          for row in rows:
              if only and row['version'] not in only:
                  continue
              target = int(row.get('java') or 21)
              picks.append({
                  'version': row['version'],
                  'java': str(target),
                  # Gradle 9.4.1 needs 17+, and 1.21.x-era provisioning for the 26.x rows refuses to
                  # run on anything below the game's own target ("Minecraft 26.3 requires Java 25 but
                  # Gradle is using 21"), so the runner JVM is the higher of the two.
                  'gradle_java': str(max(21, target)),
                  'neoforge': 'yes' if row.get('neoforge') else 'no',
                  'status': row.get('status', 'derived'),
              })
          if not picks:
              print('matrix=[]', file=sys.stderr)
              sys.exit(1)
          print('matrix=' + json.dumps(picks, separators=(',', ':')))
          print('full=' + ('true' if len(picks) == len(rows) else 'false'))
          print(f"planned {len(picks)} legs", file=sys.stderr)
          PY

  ship:
    name: ${{ matrix.version }} (java ${{ matrix.java }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: read mod_version
        shell: bash
        run: echo "MOD_VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
          cache-read-only: false
      # Two separate setup-java calls, in this order, because setup-java makes the LAST
      # version it installs the active JAVA_HOME: the row's own JDK first (so the
      # `java { toolchain { } }` block in each build script finds it in hostedtoolcache),
      # then 21 (so Gradle itself runs on a JVM it supports). A single call with a list
      # put 1.16.5's Java 8 on JAVA_HOME and every leg of the first ship run died with
      # "Gradle requires JVM 17 or later to run. Your build is currently configured to
      # use JVM 8."
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.gradle_java }}
      - name: materialize the ported tree
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/tree"
          mkdir -p "$work"
          # Tracked files only, same rule as tools/port.sh --dry-run: a port must be
          # checkable against what a clone would contain, nothing else.
          git ls-files -z | xargs -0 -I{} cp --parents {} "$work"/
          cd "$work"
          patch="deltas/${{ matrix.version }}/changes.patch"
          if [ -f "$patch" ]; then
            git apply --whitespace=nowarn "$patch"
            echo "applied $patch"
          else
            echo "no delta for ${{ matrix.version }} - this is the reference tree (expected for 1.21.1)"
          fi
          echo "### Pins after the delta (${{ matrix.version }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(minecraft_version|fabric_loader|fabric_version|neoforge_version|yarn_mappings|loom_version|java_version)=' gradle.properties || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: build
        shell: bash
        run: |
          set -u -o pipefail
          cd "$RUNNER_TEMP/tree"
          tasks=":common:build :fabric:build"
          if [ "${{ matrix.neoforge }}" = yes ]; then
            tasks="$tasks :neoforge:build"
          else
            echo "neoforge is null on ${{ matrix.version }}: the delta disables the module (Fabric-only row)"
          fi
          gradle --no-daemon --console=plain --stacktrace --continue $tasks \
            2>&1 | tee "$RUNNER_TEMP/build.log"
          rc=${PIPESTATUS[0]}
          # The exit code is recorded and fails the leg. `build` runs assemble before check, so a
          # version whose tests fail still has jars; they are uploaded as a run artifact for
          # diagnosis, but the publish step only runs on success().
          printf '%s\n' "$rc" > "$RUNNER_TEMP/build.rc"
          exit "$rc"
      - name: collect the jars
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tree"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for module in fabric neoforge; do
            dir="$module/build/libs"
            [ -d "$dir" ] || continue
            for jar in "$dir"/*.jar; do
              [ -f "$jar" ] || continue
              case "$(basename "$jar")" in
                *-sources.jar|*-javadoc.jar|*dev.jar) continue ;;
              esac
              out="$GITHUB_WORKSPACE/dist/aetherium-$module-$MOD_VERSION+${{ matrix.version }}.jar"
              cp "$jar" "$out"
              echo "- \`$(basename "$out")\` ($(stat -c%s "$out") bytes, built from $jar)" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          ls -l "$GITHUB_WORKSPACE/dist" || true
      - name: publish the release
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          tag="v$MOD_VERSION+${{ matrix.version }}"
          assets=$(find dist -maxdepth 1 -type f -name '*.jar' | sort | tr '\n' ' ')
          if [ -z "${assets// }" ]; then
            printf '::error::%s: no jar was produced, refusing to publish an empty release\n' "${{ matrix.version }}"
            exit 1
          fi
          built=$(printf '%s' "$assets" | tr ' ' '\n' | sed 's|.*/||' | paste -sd, - | sed 's/,/, /g')
          cat > notes.md <<EOF
          Minecraft **${{ matrix.version }}** - built by CI run \`$GITHUB_RUN_ID\` (commit \`$(git rev-parse --short HEAD)\`) from the same sources as 1.21.1 plus \`deltas/${{ matrix.version }}/changes.patch\` (matrix status: \`${{ matrix.status }}\`).

          Jars: $built

          * \`aetherium-fabric-*\` goes in \`mods/\` and needs only Fabric Loader (no Fabric API).
          * \`aetherium-neoforge-*\` needs nothing extra. $([ "${{ matrix.neoforge }}" = no ] && echo "There is no NeoForge/Forge jar for this version: the porting row pins no NeoForge, so the loader shell is disabled by the delta.")
          * Each jar requires exactly Minecraft ${{ matrix.version }}: its version-specific code was selected and compiled for that version only.
          * New in 1.18.3 (test build, Minecraft 1.16.5 only): Aetherium Lite looks better on every profile (filmic colours, warm light, sky glow on Medium, subtle god rays on High), leaves and grass no longer draw black on Android GL translators (Aetherium adds the alpha test OpenGL ES lacks), shadow maps work the way OpenGL ES allows, and the new Aetherium Diagnostic pack shows what your device delivers to shaders.
          * From 1.18.2 (test build, Minecraft 1.16.5 only): your shader packs show up in the Shaders tab even when the launcher gives each version its own game folder (Aetherium searches every shaderpacks folder up to .minecraft), the shaderpacks folder is created if missing, unzipped packs with an extra folder level load, and the Pack folder row shows where Aetherium looks and how many packs it found.
          * From 1.18.1 (test build, Minecraft 1.16.5 only): shader fixes for Android GL translators. The world no longer draws as flat fog colour with a black hand on Krypton and gl4es (Aetherium now tests how many texture units really work and stays inside that limit), and text no longer disappears after switching a pack, profile or option. Full-screen passes get more texture units and samplers that point to the same texture share one, so packs fit better on 8-unit devices.
          * From 1.18.0 (test build, Minecraft 1.16.5 only): shader packs. Aetherium loads OptiFine and Iris format shader packs by itself, without OptiFine, Iris or Sodium. Drop a pack folder or zip into shaderpacks and pick it in the new Shaders tab, which shows the pack options, sliders and profiles; Aetherium Lite is a light built-in pack for phones. Shadows, deferred, composite and final passes all run. PC uses a modern OpenGL mode (GLSL up to 4.50); Android GL translators (gl4es, Krypton) use a compatibility mode, chosen automatically or forced in the tab. Tested in CI with BSL, Complementary Reimagined, MakeUp Ultra Fast, Sildur's Vibrant and Aetherium Lite. This is a test build: some packs may still draw wrong or slowly.
          * From 1.17.0: the Quality of life tab, first tested on Minecraft 1.16.5 in the 1.16.x test builds, now works on every version from 1.16.5 to 26.3. Every feature is off by default, runs only on your client and works on any server, including servers without Aetherium: accurate block placement, scroll and Shift-drag item moving, a sort button and Sort key for chests and your inventory, food info with an AppleSkin-style gold saturation outline on the hunger bar, waypoints with beams and Nether/Overworld conversion (B adds one, N opens the list), a death point, Nether and Overworld coordinates on the HUD, a lower fire overlay, a lowered shield, floating damage and heal numbers, a custom crosshair that turns red on mobs, and a Punchy-style hand editor with live preview, Show hand with items, Show both hands and Arms sideways, height, distance and size. Zoom and freelook options moved to the QoL tab. An option a version cannot use is hidden on that version (the hand editor and arms are not on 26.3 yet).
          * From 1.15.0: Far terrain and the chunk streaming tweaks now work on every version from 1.16.5 to 26.3. Far terrain (Quality page, Overworld) draws a cheap low-detail outline of the land beyond your render distance from chunks you already received, fills chunks that are not built yet, and moves the distance fog out to its edge; it has its own small OpenGL 3 renderer on 1.17 and newer, never adds draws to real chunks, and turns itself off after any error, with shader packs and on the Vulkan backend. Off (0) by default. Merge chunk rebuilds and Smarter chunk culling (sections hidden in the fog are neither drawn nor rebuilt) now also run on 26.2 and 26.3, so every version has the full streaming set.
          * From 1.14.0: Render scale (Performance page) now works on every version from 1.16.5 to 26.3. Below 100% the 3D world is drawn at 50 to 95% of the window resolution and stretched back with smooth filtering, while the HUD, text and menus stay sharp: the biggest single frame-rate gain for weak GPUs and phones. It returns to full resolution by itself while glowing entities are on screen and with Fabulous graphics (Improved Transparency on 26.x). Off (100%) by default.
          * From 1.13.0: the features of 1.10.0 to 1.12.0, first built for Minecraft 1.16.5, now run on every version from 1.16.5 to 26.3 wherever that version still has the code they change: directional culling, view-first chunk building, ocean floor culling, Nether roof culling, crowd culling, the entity detail distance (name tags, shadows, item frames, signs, minecarts, armour and held items), the block entity limit, smooth autosave, elytra chunk preloading, portal preloading, faster loading screens, lighter weather, calmer translucent sorting, the cloud distance slider, GL call trimming, the light table rate, the bigger smooth-lighting cache, fast grass, leaves mode and leaf culling, glint and beam toggles, throttled maps, the explosion particle budget, merged light updates, the world behind menus redrawn 4 times a second and the colour filter. An option a version cannot use is hidden on that version.
          * From 1.12.0: directional culling (the visibility search never steps back towards you, so hidden caves and rooms are skipped), view-first chunk building, faster singleplayer lighting (64 light jobs per pass instead of 5), a calmer built-in server between ticks, portal preloading, faster join and dimension-change loading screens, End optimizations (chorus joints not built, the End sky in one draw), GL call trimming (framebuffer, viewport and vertex-array switches that change nothing are skipped; off next to OptiFine, Iris, Canvas or Sodium), a cheaper hurt and creeper flash, the light table updated 10 times a second, a bigger smooth-lighting cache, background loading of saved skins, a Cloud distance slider for Fancy clouds, and two opt-in options: Fast grass and Ocean floor culling. All are on the Quality and Performance pages and can be switched off one by one.
          * From 1.11.0: Far terrain (an optional low-detail outline of the land beyond your render distance, which also fills chunks that are not built yet, with the fog moved out to its edge; off by default), a Colour filter (Vibrant, Warm or Cinematic grading in one cheap pass; off by default), the world behind menus redrawn 4 times a second instead of every frame, mob model detail levels, a block entity limit per frame, sign text hidden beyond the entity detail distance, calmer translucent sorting, lazy rebuilds of far chunks and a redstone particle limit per tick. Also in this line since 1.10.0: the phone frame-rate fix, Dynamic FPS, Low-end mode, Hitch guard, entity detail distance, crowd culling, the explosion particle budget, merged light updates, throttled maps, background player-head skins, Nether roof culling, smooth autosave, elytra chunk preloading, leaves mode with leaf culling, lighter weather, glint / beam / redstone particle toggles, lazy data fixers and a Mod Menu button. All new options are on the Quality and Performance pages. $([ "${{ needs.plan.outputs.full }}" = true ] || echo "**Test build:** published on GitHub only, not on Modrinth or CurseForge.")
          * The Aetherium renderer (Video Settings > Backend) is on by default on every version (1.16.5 to 26.3): solid and cutout chunk meshes are grouped by face direction and each section draws only the faces that can point at you, never with more draw calls than vanilla. It falls back to vanilla on any error and stays off after a crash while it was drawing. Aetherium adds no shaders to the terrain (the optional Colour filter on 1.16.5 is a single full-screen pass). Built and unit-tested on CI: read VERIFICATION.md before filing a rendering bug.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=${{ needs.plan.outputs.full != 'true' }} \
              --target "$GITHUB_SHA" --title "Aetherium $MOD_VERSION (Minecraft ${{ matrix.version }})" \
              --notes-file notes.md
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber $assets
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=${{ needs.plan.outputs.full != 'true' }} \
              --target "$GITHUB_SHA" --title "Aetherium $MOD_VERSION (Minecraft ${{ matrix.version }})" \
              --notes-file notes.md $assets
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: report what failed, legibly
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || { echo "::error::no build log; the failure is upstream of Gradle"; exit 0; }
          # Failing tests, by name, with the assertion message: Gradle's console output has
          # them, but the only thing readable from the API is an annotation.
          # Failing tests, by name, with the assertion message. A heredoc cannot be piped (the
          # continuation line would be eaten as heredoc body), so the python writes a file and the
          # annotation loop reads it - same reason the compiler report is chunked.
          if ls "$RUNNER_TEMP/tree"/*/build/test-results/test/*.xml >/dev/null 2>&1; then
            python3 - "$RUNNER_TEMP/tree" > "$RUNNER_TEMP/tests.txt" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          for path in glob.glob(sys.argv[1] + '/*/build/test-results/test/*.xml'):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  for bad in list(case.iter('failure')) + list(case.iter('error')):
                      text = (bad.get('message') or (bad.text or '')).strip().split('\n')
                      print('%s#%s :: %s' % (case.get('classname'), case.get('name'), ' / '.join(text[:2])[:220]))
          PY
            if [ -s "$RUNNER_TEMP/tests.txt" ]; then
              sed -e 's/%/%25/g' -e 's/$/%0A/' "$RUNNER_TEMP/tests.txt" | tr -d '\n\r' | fold -w 900 |
                nl -ba -w1 -s/ | while IFS=/ read -r line; do
                  printf '::error::tests (%s) part %s\n' "${{ matrix.version }}" "$line"
                done || true
              body=$(sed -e 's/$/%0A/' "$RUNNER_TEMP/tests.txt" | head -6 | tr -d '\n\r')
              printf '::error::tests %s:%s\n' "${{ matrix.version }}" "$(printf '%s' "$body" | sed 's/%/%25/g')"
            fi
          fi
          awk '/^\* What went wrong:/{f=1} f{print} /^\* Try:/{if(f)exit}' "$log" 2>/dev/null |
            head -60 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' |
            { read -r body || true; [ -n "$body" ] && printf '::error::what gradle says:%s\n' "$body"; } || true
          # Compiler errors with the lines under them (symbol:/location:), chunked because a
          # single long annotation gets truncated by GitHub.
          awk '/: (error|warning):/{c=9} c>0{print; c--}' "$log" 2>/dev/null |
            sed -e 's/%/%25/g' | head -220 | tr -d '\r' > "$RUNNER_TEMP/errors.txt" || true
          if [ -s "$RUNNER_TEMP/errors.txt" ]; then
            split -l 22 "$RUNNER_TEMP/errors.txt" "$RUNNER_TEMP/errors.part"
            total=$(ls "$RUNNER_TEMP"/errors.part* | wc -l); n=0
            for part in "$RUNNER_TEMP"/errors.part*; do
              n=$((n + 1))
              body=$(sed -e 's/$/%0A/' "$part" | tr -d '\n')
              printf '::error::compiler %s/%s (%s):%s\n' "$n" "$total" "${{ matrix.version }}" "$body"
            done
          fi
          # Signatures are settled with javap against the jars Gradle actually resolved, not by
          # guessing: every class named in a "location:" line is dumped from the real artifact.
          classes=$(grep -hoE 'location: (class|interface|variable [a-zA-Z]+ of type) [A-Za-z0-9_.$]+' "$RUNNER_TEMP/errors.txt" \
            | awk '{print $NF}' | sort -u | head -6)
          if [ -n "$classes" ]; then
            mcjar=$(find "$HOME/.gradle/caches/fabric-loom" -name 'minecraft-merged*.jar' 2>/dev/null | head -1)
            lwj=$(find "$HOME/.gradle/caches/modules-2/files-2.1" -name 'lwjgl-opengl-*.jar' 2>/dev/null | head -1)
            dump=$(mktemp)
            for cls in $classes; do
              short=${cls##*.}
              case "$cls" in
                org.lwjgl.*) target="$lwj" ;;
                *) target="$mcjar" ;;
              esac
              [ -n "$target" ] || continue
              echo "== javap $cls ($target)" >> "$dump"
              javap -cp "$target" "$cls" 2>&1 | head -70 >> "$dump" || true
              javap -cp "$target" "$short" 2>&1 | head -40 >> "$dump" 2>/dev/null || true
            done
            if [ -s "$dump" ]; then
              split -l 60 "$dump" /tmp/javap.part
              n=0
              for part in /tmp/javap.part*; do
                n=$((n + 1))
                body=$(sed -e 's/%/%25/g' -e 's/$/%0A/' "$part" | tr -d '\n\r')
                printf '::warning::javap %s (%s):%s\n' "$n" "${{ matrix.version }}" "$body"
              done
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ship-${{ matrix.version }}
          path: |
            dist/*.jar
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 14

  modrinth:
    name: publish to Modrinth
    needs: [plan, ship]
    # Publish whatever shipped, even if one leg failed; the publisher skips versions that are
    # already on Modrinth, so the next run fills in anything missing. Partial (test) ships stay
    # on GitHub only.
    if: always() && needs.ship.result != 'cancelled' && needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/modrinth.yml
    secrets: inherit

  curseforge:
    name: publish to CurseForge
    needs: [plan, ship]
    if: always() && needs.ship.result != 'cancelled' && needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/curseforge.yml
    secrets: inherit

  downloads:
    name: write DOWNLOADS.md from the releases that exist
    needs: [plan, ship]
    if: always() && needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: build the table
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          rows = json.load(open('tools/porting_pins.json'))['rows']
          mod_version = next(l.split('=', 1)[1].strip() for l in open('gradle.properties')
                             if l.startswith('mod_version='))
          owner_repo = subprocess.run(['gh', 'repo', 'view', '--json', 'nameWithOwner', '-q', '.nameWithOwner'],
                                      capture_output=True, text=True).stdout.strip()
          lines = [
              '# Downloads',
              '',
              'Every link below points at an asset attached to a real GitHub release, produced by',
              '`ship.yml`: the same sources, ported by `deltas/<version>/changes.patch`, compiled',
              'against that version\'s own mappings, and packaged by CI. A version with no link is',
              'not shipped - the table only ever lists what exists, never what should exist.',
              '',
              '| Minecraft | Loader | Jar |',
              '| --- | --- | --- |',
          ]
          blocked = []
          shipped = 0
          for row in rows:
              ver = row['version']
              tag = 'v' + mod_version + '+' + ver
              out = subprocess.run(['gh', 'release', 'view', tag, '--json', 'assets,isDraft,url',
                                    '-q', '{assets: [.assets[].name], draft: .isDraft, url: .url}'],
                                   capture_output=True, text=True)
              if out.returncode != 0:
                  blocked.append((ver, 'no release yet'))
                  continue
              info = json.loads(out.stdout)
              if info['draft']:
                  blocked.append((ver, 'release exists but is a draft'))
                  continue
              names = sorted(n for n in info['assets'] if n.endswith('.jar'))
              if not names:
                  blocked.append((ver, 'release has no jar asset'))
                  continue
              shipped += 1
              for name in names:
                  loader = 'Fabric' if '-fabric-' in name else ('NeoForge' if '-neoforge-' in name else 'unknown')
                  lines.append('| %s | %s | [%s](https://github.com/%s/releases/download/%s/%s) |'
                               % (ver, loader, name, owner_repo, tag, name))
              if row.get('neoforge') is None:
                  lines.append('| %s | Forge/NeoForge | *none: this row pins no (Neo)Forge loader; see VERIFICATION.md* |' % ver)
          lines += ['', 'Shipped: **%d/%d** Minecraft versions.' % (shipped, len(rows)), '']
          if blocked:
              lines += ['## Not shipped', '']
              lines += ['- **%s** - %s' % (v, why) for v, why in blocked]
              lines.append('')
          open('DOWNLOADS.md', 'w').write('\n'.join(lines))
          print(open('DOWNLOADS.md').read())
          PY
      - name: commit it
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DOWNLOADS.md
          if git diff --cached --quiet; then echo 'DOWNLOADS.md unchanged'; exit 0; fi
          git commit -q -m "docs: DOWNLOADS.md for the releases ship.yml published ([skip ci]

          Generated by the downloads job of run $GITHUB_RUN_ID from \`gh release view\` output, so every
          link in it is an asset that exists at the moment the table was written. No hand-edited row and no
          placeholder URL: a version with no jar is listed under \"Not shipped\" with the reason."
          # Other commits (probe results, docs) can land while the matrix runs; rebase onto them.
          for attempt in 1 2 3 4 5; do
            git pull -q --rebase origin "${{ github.ref_name }}" && \
              git push -q origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push attempt $attempt lost a race; retrying"
            sleep $((attempt * 5))
          done
          echo '::error::could not push DOWNLOADS.md after 5 attempts'
          exit 1
