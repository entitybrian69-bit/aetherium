# Aetherium Backport for Minecraft 1.8.9 (Forge): build, in-game smoke test, release.
# Results are committed back to backport189/ci/out (logs cannot be downloaded from the dev sandbox).
# A commit message containing [backport189-release] publishes the GitHub release (tag
# backport-v<ver>+1.8.9) and uploads it to the CurseForge "Aetherium Backport" project, but only
# after the build succeeded and the smoke test passed (every mixin injector found its target).
name: backport189
on:
  push:
    branches: [arena/46f241da-aetherium]
    paths: ['backport189/**', '.github/workflows/backport189.yml', '!backport189/ci/out/**']
permissions:
  contents: write
concurrency:
  group: backport189-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      built: ${{ steps.status.outputs.built }}
      smoke: ${{ steps.smoke.outputs.smoke }}
      version: ${{ steps.status.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: bash backport189/ci/run.sh
      - name: status
        id: status
        run: |
          s=$(cat backport189/ci/out/build-status.txt)
          echo "::notice::backport189 build exit $s"
          head -c 3500 backport189/ci/out/build-report.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::notice::report%0A/'; echo
          v=$(sed -n 's/^modVersion *= *//p' backport189/gradle.properties | tr -d '\r ')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          jar=$(ls backport189/build/libs/*.jar 2>/dev/null | grep -vE -- '-(dev|sources|without-deps|non-obfuscated-with-deps)\.jar$' | head -1)
          if [ "$s" = 0 ] && [ -n "$jar" ]; then
            mkdir -p dist && cp "$jar" "dist/aetherium-backport-$v+1.8.9.jar"
            echo "built=1" >> "$GITHUB_OUTPUT"
            unzip -l "dist/aetherium-backport-$v+1.8.9.jar" > backport189/ci/out/jar-contents.txt
            unzip -p "dist/aetherium-backport-$v+1.8.9.jar" META-INF/MANIFEST.MF > backport189/ci/out/manifest.txt || true
            unzip -p "dist/aetherium-backport-$v+1.8.9.jar" mixins.aetherium.refmap.json > backport189/ci/out/refmap.json || true
          else
            echo "built=0" >> "$GITHUB_OUTPUT"
          fi
      - name: smoke test (Xvfb + Mesa)
        id: smoke
        if: steps.status.outputs.built == '1'
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q xvfb x11-xserver-utils libgl1-mesa-dri libglu1-mesa imagemagick >/dev/null
          if bash backport189/ci/smoke.sh; then echo "smoke=1" >> "$GITHUB_OUTPUT"; r=PASS; else echo "smoke=0" >> "$GITHUB_OUTPUT"; r=FAIL; fi
          echo "::notice::smoke $r (exit $(cat backport189/ci/out/smoke/status.txt 2>/dev/null))"
          cat backport189/ci/out/smoke/report.txt 2>/dev/null | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::notice::smoke report%0A/'; echo
      - name: commit results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f backport189/ci/out 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "backport189: CI results for ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3 4 5; do git pull -q --rebase origin "${{ github.ref_name }}" && git push -q origin "HEAD:${{ github.ref_name }}" && exit 0; sleep $((i*5)); done
          exit 1
      - uses: actions/upload-artifact@v4
        if: steps.status.outputs.built == '1'
        with:
          name: backport189-jar
          path: dist/*.jar

  release:
    needs: build
    if: contains(github.event.head_commit.message, '[backport189-release]') && needs.build.outputs.built == '1' && needs.build.outputs.smoke == '1'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backport189-jar
          path: dist
      - name: GitHub release
        run: |
          tag="backport-v$VERSION+1.8.9"
          jar="dist/aetherium-backport-$VERSION+1.8.9.jar"
          notes=$(mktemp)
          { echo "**Aetherium Backport $VERSION** for Minecraft 1.8.9 (Forge). Client-side only."; echo;
            cat backport189/ci/backport_changelog.md; } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$jar" --clobber
          else
            gh release create "$tag" "$jar" --target "$GITHUB_SHA" --title "Aetherium Backport $VERSION (1.8.9 Forge)" --notes-file "$notes" --latest=false
          fi
          echo "::notice::GITHUB release https://github.com/${{ github.repository }}/releases/tag/$tag"

  curseforge:
    needs: release
    uses: ./.github/workflows/curseforge.yml
    secrets: inherit
