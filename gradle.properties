# Aetherium — MultiLoader build pins (reference version: Minecraft 1.21.1)
#
# Provenance of every pin is recorded in docs/BUILD_PINS.md. Lines marked
# (VERIFIED) were read out of a real upstream project on 2026-10-06 via the
# GitHub contents API; lines marked (GUESS) must be checked on first build.

org.gradle.jvmargs=-Xmx2G -XX:+UseNUMA -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.daemon=true

# ------------------------------------------------------------------ toolchain
java_version=21

# ------------------------------------------------------------------- minecraft
minecraft_version=1.21.1
mapping_channel=mojmap
# officialMojangMappings() is resolved by Loom; parchment is optional and off by
# default so that a clean machine never needs the parchment maven.
parchment_version=

# ----------------------------------------------------------------------- modding
# (VERIFIED) read from CaffeineMC/sodium @ 1.21.1/stable -> common/build.gradle.kts
# Duplicated as `loom` in gradle/libs.versions.toml on purpose: a Kotlin DSL plugins {} block is
# evaluated before `project` exists and cannot read this property, so the catalog is what the build
# applies. tools/check.py fails if the two stop matching. Every porting row inherits this pin - a
# Loom from another era would not run on the tree-wide Gradle 9.4.1 (PORTING_MATRIX.md, "Loom, and
# why one version serves all 33 rows").
fabric_loom_version=1.16.1
# (VERIFIED) read from CaffeineMC/sodium @ 1.21.1/stable -> neoforge/build.gradle.kts
# Also `moddev` in gradle/libs.versions.toml; check.py keeps the pair equal.
neoforge_moddev_version=2.0.141
# (VERIFIED) read from CaffeineMC/sodium @ 1.21.1/stable -> buildSrc BuildConfig.kt
neoforge_version=21.1.228
# (VERIFIED) fabric-loader 0.16.9 exists (git ls-remote --tags FabricMC/fabric-loader);
# the latest loader line (0.19.x) also works, this pin keeps the reference era-accurate.
fabric_loader_version=0.16.9
# (VERIFIED) latest fabric-api tag for 1.21.1 read from FabricMC/fabric on 2026-10-10;
# compile-only and optional at runtime (see fabric/build.gradle.kts).
fabric_api_version=0.116.17+1.21.1
# (VERIFIED) read from CaffeineMC/sodium @ 1.21.1/stable -> common/build.gradle.kts
mixin_extras_version=0.5.3
# (VERIFIED) same source
sponge_mixin_version=0.13.2+mixin.0.8.5

# --------------------------------------------------------------- native / GL/LWJGL
# MC 1.21.1 ships LWJGL 3.3.3 (GL 4.6 bindings available: GL43C/GL45C/GL46C).
lwjgl_version=3.3.3

# ------------------------------------------------------------------------ plugin
# (VERIFIED) Embeddium/NeoForge is the precedent for a Sodium-lineage mod on NeoForge.
forgified_fabric_api_version=0.10.0+1.21

# ----------------------------------------------------------------------- project
mod_id=aetherium
mod_name=Aetherium
mod_version=1.2.0
mod_description=Rendering engine replacement with Iris compatibility, dynamic lights, gamma utilities and Android renderer routing.
mod_homepage=https://github.com/entitybrian69-bit/aetherium
mod_sources=https://github.com/entitybrian69-bit/aetherium
mod_issue_tracker=https://github.com/entitybrian69-bit/aetherium/issues
mod_license=LGPL-3.0-only
maven_group=com.aetherium
archives_base_name=aetherium
enabled_platforms=fabric,neoforge
# Set to false on machines without a GPU (CI compile-only jobs).
aetherium.enableRunConfigs=false
