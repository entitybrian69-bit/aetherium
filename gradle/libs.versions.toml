# Version catalog. Single source of truth for the *tooling* plugins so that
# deltas only ever have to touch gradle.properties (mechanical, low-risk).
[versions]
checkstyle = "10.20.1"
junit = "5.11.4"
gitversion = "1.0.0"

[plugins]
gitversion = { id = "com.palantir.git-version", version.ref = "gitversion" }
